<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>1A2B｜數字偵探</title>
<style>
:root{color-scheme:dark;--bg:#10131c;--panel:#191e2b;--line:#2c3447;--muted:#929bb0;--text:#f2f5ff;--mint:#67e8bd;--pink:#ff8bb2;--gold:#ffd166}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#26334a 0,transparent 55%),var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:32px 16px}.wrap{width:min(100%,520px)}header{text-align:center;margin:6px 0 25px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}h1{margin:4px 0;font-size:clamp(35px,9vw,52px);letter-spacing:.04em}header p{color:var(--muted);margin:0}.card{background:linear-gradient(145deg,#1b2130,#171b27);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 60px #0004}.secret{display:flex;justify-content:center;gap:10px;margin:4px 0 20px}.digit{width:52px;height:62px;border-radius:14px;background:#111621;border:1px solid #343d52;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--mint)}.hint{text-align:center;font-size:14px;color:var(--muted);margin-bottom:19px}.guess-row{display:flex;gap:10px}.guess-row input{flex:1;min-width:0;background:#10141e;color:var(--text);border:1px solid #384258;border-radius:12px;padding:13px 15px;font:700 19px ui-monospace,monospace;letter-spacing:.23em;text-align:center;outline:none}.guess-row input:focus{border-color:var(--mint);box-shadow:0 0 0 3px #67e8bd20}.btn{border:0;border-radius:12px;padding:0 19px;background:var(--mint);color:#10251f;font-weight:850;font-size:15px;cursor:pointer;transition:transform .15s,filter .15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(0)}.secondary{background:#252d3e;color:var(--text);border:1px solid #39435a;padding:10px 14px}.message{min-height:24px;text-align:center;color:var(--gold);font-size:14px;margin:12px 0 5px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}.toolbar h2{font-size:15px;margin:0}.count{font-size:13px;color:var(--muted)}.history{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}.empty{border:1px dashed #343d50;border-radius:12px;padding:17px;text-align:center;color:var(--muted);font-size:14px}.entry{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;background:#121722;border:1px solid #272f40;border-radius:12px;padding:11px 14px;animation:pop .25s ease}.entry .n{font:800 20px ui-monospace,monospace;letter-spacing:.18em}.badge{font-weight:850;color:var(--mint);white-space:nowrap}.entry.win{border-color:#67e8bd70;background:#14231f}.rules{color:var(--muted);font-size:13px;text-align:center;margin:16px 8px 0}@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}@media(max-width:420px){body{padding:21px 12px}.card{padding:17px}.guess-row{gap:7px}.btn{padding:0 14px}.entry{gap:9px;padding:10px 11px}}
</style>
</head>
<body><main class="wrap">
<header><div class="eyebrow">Number Detective</div><h1>1A2B</h1><p>猜出隱藏數字，成為數字偵探。</p></header>
<section class="card" aria-label="1A2B 遊戲">
<div class="secret" aria-label="四位不重複的數字"><span class="digit">?</span><span class="digit">?</span><span class="digit">?</span><span class="digit">?</span></div>
<div class="hint">猜一組 <b>4 位不重複</b>的數字。位置正確是 A，數字正確但位置不同是 B。</div>
<form id="form" class="guess-row"><input id="guess" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="例如 1234" aria-label="輸入四位數字"><button class="btn" id="submit" type="submit">猜猜看</button></form>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="toolbar"><h2>猜測紀錄</h2><span class="count" id="count">0 次</span></div><div class="history" id="history"><div class="empty">輸入第一個猜測，開始挑戰吧！</div></div>
</section><p class="rules">不會出現重複數字 · 可以用 0 開頭 · 挑戰看看幾次猜中</p>
</main>
<script>
(()=>{const answer=Array.from({length:10},(_,i)=>i);for(let i=9;i>0;i--){const j=Math.floor(Math.random()*(i+1));[answer[i],answer[j]]=[answer[j],answer[i]]}const secret=answer.slice(0,4).join('');let turns=0,done=false;const form=document.querySelector('#form'),input=document.querySelector('#guess'),history=document.querySelector('#history'),count=document.querySelector('#count'),message=document.querySelector('#message'),btn=document.querySelector('#submit');input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,4)});form.addEventListener('submit',e=>{e.preventDefault();if(done)return;const g=input.value;if(g.length!==4){message.textContent='請輸入完整的 4 位數字。';input.focus();return}if(new Set(g).size!==4){message.textContent='每個數字都要不一樣喔！';input.focus();return}const A=[...g].filter((d,i)=>d===secret[i]).length,B=[...g].filter(d=>secret.includes(d)).length-A;turns++;count.textContent=`${turns} 次`;if(turns===1)history.innerHTML='';const row=document.createElement('div');row.className='entry'+(A===4?' win':'');row.innerHTML=`<span class="n"></span><span class="badge"></span><span class="count">第 ${turns} 次</span>`;row.querySelector('.n').textContent=g;row.querySelector('.badge').textContent=`${A}A ${B}B`;history.prepend(row);input.value='';if(A===4){done=true;message.textContent=`答對了！你用了 ${turns} 次破解密碼 🎉`;btn.textContent='再玩一次';document.querySelectorAll('.digit').forEach((el,i)=>el.textContent=secret[i]);btn.onclick=()=>location.reload()}else{message.textContent='繼續推理，下一個線索就快出現了。';input.focus()}})})();
</script></body></html>
